const KEY="club_abierto_amoy_deploy_tx_v1";
const statusEl=document.getElementById("status");
const retry=document.getElementById("retry");
function setStatus(t,cls=""){statusEl.className="status "+cls;statusEl.textContent=t;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function receipt(tx){
  for(let i=0;i<120;i++){
    const r=await ethereum.request({method:"eth_getTransactionReceipt",params:[tx]});
    if(r) return r;
    await sleep(2500);
  }
  throw new Error("La transacción sigue pendiente. Volvé a abrir esta página en unos minutos.");
}
async function start(){
  retry.classList.add("hidden");
  try{
    if(!window.ethereum) throw new Error("No se detectó MetaMask en este navegador.");
    const prev=localStorage.getItem(KEY);
    if(prev){
      setStatus("Ya existe una transacción de despliegue registrada en este navegador. Verificando confirmación...\n"+prev,"warn");
      const r=await receipt(prev);
      if(r.status!=="0x1") throw new Error("La transacción anterior falló.");
      setStatus("CONTRATO DESPLEGADO\n\nTX: "+prev+"\n\nCONTRATO: "+r.contractAddress+"\n\nNo cierres esta información: pasá la dirección del contrato al chat.","ok");
      return;
    }
    setStatus("Solicitando acceso a Account 1 en MetaMask...","warn");
    const accounts=await ethereum.request({method:"eth_requestAccounts"});
    const account=(accounts[0]||"").toLowerCase();
    if(account!==EXPECTED) throw new Error("La cuenta seleccionada no es la wallet de Club Abierto esperada. Seleccioná Account 1: "+EXPECTED);
    let chain=await ethereum.request({method:"eth_chainId"});
    if(chain.toLowerCase()!==CHAIN_HEX){
      setStatus("Cambiando MetaMask a Polygon Amoy...","warn");
      await ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:CHAIN_HEX}]});
      chain=await ethereum.request({method:"eth_chainId"});
    }
    if(chain.toLowerCase()!==CHAIN_HEX) throw new Error("MetaMask no quedó en Polygon Amoy (80002).");
    const bal=BigInt(await ethereum.request({method:"eth_getBalance",params:[account,"latest"]}));
    if(bal===0n) throw new Error("La wallet figura con 0 POL en Amoy.");
    const encodedOwner=EXPECTED.slice(2).padStart(64,"0");
    const data=BYTECODE+encodedOwner;
    setStatus("Todo preparado. MetaMask va a pedirte AHORA confirmar el despliegue del contrato.\n\nVos sólo tenés que confirmar esa transacción.","warn");
    const tx=await ethereum.request({method:"eth_sendTransaction",params:[{from:account,data}]});
    localStorage.setItem(KEY,tx);
    setStatus("Transacción enviada. Esperando confirmación en Amoy...\n"+tx,"warn");
    const r=await receipt(tx);
    if(r.status!=="0x1") throw new Error("La transacción fue minada pero falló.");
    setStatus("CONTRATO DESPLEGADO\n\nTX: "+tx+"\n\nCONTRATO: "+r.contractAddress+"\n\nCopiá la dirección del contrato y mandala al chat.","ok");
  }catch(e){
    setStatus("No se completó el despliegue:\n\n"+(e?.message||String(e)),"err");
    retry.classList.remove("hidden");
  }
}
retry.addEventListener("click",start);
setTimeout(start,700);
</script>
