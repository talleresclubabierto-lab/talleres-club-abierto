  try{
    if(!window.ethereum) throw new Error("MetaMask no detectado");

    const source = "// SPDX-License-Identifier: MIT\npragma solidity ^0.8.24;\ncontract ClubAbiertoAnchorV2 {\n    address public owner;\n    address public pendingOwner;\n    address public anchorer;\n    struct Anchor { bytes32 merkleRoot; uint64 leafCount; uint64 anchoredAt; }\n    mapping(bytes32 => Anchor) public anchors;\n    event OwnershipTransferStarted(address indexed currentOwner,address indexed pendingOwner);\n    event OwnershipTransferred(address indexed previousOwner,address indexed newOwner);\n    event AnchorerChanged(address indexed previousAnchorer,address indexed newAnchorer);\n    event BatchAnchored(bytes32 indexed referenceHash,bytes32 indexed merkleRoot,uint64 leafCount,uint64 anchoredAt);\n    error Unauthorized(); error InvalidValue(); error AlreadyAnchored();\n    modifier onlyOwner(){if(msg.sender!=owner) revert Unauthorized(); _;}\n    modifier onlyAnchorer(){if(msg.sender!=anchorer) revert Unauthorized(); _;}\n    constructor(address initialOwner,address initialAnchorer){\n        if(initialOwner==address(0)||initialAnchorer==address(0)) revert InvalidValue();\n        owner=initialOwner; anchorer=initialAnchorer;\n        emit OwnershipTransferred(address(0),initialOwner);\n        emit AnchorerChanged(address(0),initialAnchorer);\n    }\n    function transferOwnership(address newOwner) external onlyOwner {\n        if(newOwner==address(0)) revert InvalidValue(); pendingOwner=newOwner;\n        emit OwnershipTransferStarted(owner,newOwner);\n    }\n    function acceptOwnership() external {\n        if(msg.sender!=pendingOwner) revert Unauthorized();\n        address previous=owner; owner=pendingOwner; pendingOwner=address(0);\n        emit OwnershipTransferred(previous,owner);\n    }\n    function setAnchorer(address newAnchorer) external onlyOwner {\n        if(newAnchorer==address(0)) revert InvalidValue();\n        address previous=anchorer; anchorer=newAnchorer;\n        emit AnchorerChanged(previous,newAnchorer);\n    }\n    function anchor(bytes32 referenceHash,bytes32 merkleRoot,uint64 leafCount) external onlyAnchorer {\n        if(referenceHash==bytes32(0)||merkleRoot==bytes32(0)||leafCount==0) revert InvalidValue();\n        if(anchors[referenceHash].anchoredAt!=0) revert AlreadyAnchored();\n        uint64 timestamp=uint64(block.timestamp);\n        anchors[referenceHash]=Anchor(merkleRoot,leafCount,timestamp);\n        emit BatchAnchored(referenceHash,merkleRoot,leafCount,timestamp);\n    }\n    function verifyAnchor(bytes32 referenceHash,bytes32 merkleRoot,uint64 leafCount) external view returns(bool){\n        Anchor memory saved=anchors[referenceHash];\n        return saved.anchoredAt!=0&&saved.merkleRoot==merkleRoot&&saved.leafCount==leafCount;\n    }\n}";

        }
      };

      const timer=setTimeout(()=>{w.terminate();reject(new Error("Timeout compilando contrato V2"));},45000);
      w.onmessage=(ev)=>{
        clearTimeout(timer);
        w.terminate();
        URL.revokeObjectURL(workerUrl);
        ev.data?.ok ? resolve(ev.data) : reject(new Error(ev.data?.error||"Error de compilación"));
      };
      w.onerror=(ev)=>{
        clearTimeout(timer);
        w.terminate();
        URL.revokeObjectURL(workerUrl);
        reject(new Error(ev.message||"Error en worker de compilación"));
      };
      w.postMessage(source);
    });

    const factory=new ContractFactory(abi,bytecode,signer);
    const deployTx=await factory.getDeployTransaction(owner,anchorer);
    const gas=await provider.estimateGas({...deployTx,from:account});
    const bal=await provider.getBalance(account);

    btn.disabled=false;
    btn.onclick=async()=>{
      btn.disabled=true;
      try{
        set("MetaMask va a pedirte confirmar UNA transacción de despliegue...","#f2cc60");
        const contract=await factory.deploy(owner,anchorer);
        const tx=contract.deploymentTransaction();
        set("Transacción enviada:\n"+tx.hash+"\n\nEsperando confirmación...","#f2cc60");
        const receipt=await tx.wait();
        const addr=await contract.getAddress();
        set("DESPLIEGUE CONFIRMADO.\n\nContrato: "+addr+"\nTX: "+tx.hash+"\nBloque: "+receipt.blockNumber+"\n\nLa integración NO fue activada.","#7ee787");
        localStorage.setItem("club_abierto_anchor_v2_deploy",JSON.stringify({contract:addr,tx:tx.hash,block:receipt.blockNumber}));
      }catch(e){set("No se completó el despliegue:\n\n"+(e?.shortMessage||e?.message||String(e)),"#ff7b72");btn.disabled=false;}
    };
  }catch(e){set("No se pudo preparar el despliegue:\n\n"+(e?.message||String(e)),"#ff7b72");}
})();

<script>
(async()=>{

  const SESSION_KEY="TD_club_session_v1";

    </main>`;

  const box=document.getElementById("wt");

  const esc=v=>String(v??"-").replace(/[&<>"]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[s]));
  const token=sessionStorage.getItem(SESSION_KEY)||"";

  if(!token){
    box.innerHTML='<div style="color:#ffcf8b"><b>Sesión de administrador requerida.</b><br><br>Ingresá primero al panel administrador de Club Abierto en esta misma pestaña/origen y luego volvé a esta URL.</div>';
    return;
  }

  try{
    const sres=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({action:"status"})
    });
    const s=await sres.json();
    if(!sres.ok) throw new Error(s?.error||("HTTP "+sres.status));

    const ref=String(s?.next_prepared_batch?.referencia||"");
    const safeRef=ref.startsWith(TEST_PREFIX);
    const send=!!s.sending_enabled;

    box.innerHTML=`
      <div style="display:grid;gap:10px">
        <div><span style="color:#9fb5cc">Red:</span> <b>${esc(s?.public_config?.red)}</b></div>

    if(!(send&&safeRef)){
      box.innerHTML += '<div style="margin-top:14px;color:#ff9b9b"><b>Prueba bloqueada:</b> no se cumplen las condiciones de aislamiento.</div>';
      return;
    }

    btn.disabled=false;
    btn.onclick=async()=>{
      btn.disabled=true;
      box.innerHTML += '<div style="margin-top:14px;color:#f2cc60">Enviando UNA transacción desde el worker. Esperando 3 confirmaciones...</div>';
      try{
        const res=await fetch(WORKER_URL,{
          method:"POST",
          headers:{
            "content-type":"application/json",
            "X-Club-Session":token
          },
          body:JSON.stringify({action:"anchor"})
        });
        const d=await res.json();
        if(!res.ok||!d?.anchored) throw new Error(d?.detail||d?.error||d?.reason||("HTTP "+res.status));

            <div>Chain ID: <b>${esc(d.chain_id)}</b></div>
          </div>
          <div style="margin-top:14px;color:#c6d8ee">No vuelvas a ejecutar el botón. La prueba quedó cerrada.</div>`;
      }catch(e){
        box.innerHTML += '<div style="margin-top:14px;color:#ff9b9b"><b>Error:</b> '+esc(e?.message||String(e))+'</div>';
      }
    };
  }catch(e){
    box.innerHTML='<div style="color:#ff9b9b"><b>Error verificando condiciones:</b> '+esc(e?.message||String(e))+'</div>';
  }
})();
</script>

<script>
(function(){
var apiUrl=SUPABASE_URL.replace(/\/$/,'')+'/functions/v1/instagram-asistente-webhook?modo=admin';
var currentState='pendiente';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dateAR(v){if(!v)return '-';try{return new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short',timeZone:'America/Argentina/Cordoba',hour12:false}).format(new Date(v))}catch(_){return String(v)}}
async function api(body){
 var token=obtenerTokenSesionClub();if(!token)throw new Error('La sesión venció. Ingresá nuevamente.');
 var r=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'X-Club-Session':token},body:JSON.stringify(body)}),d={};
 try{d=await r.json()}catch(_){}if(!r.ok||d.ok!==true)throw new Error(d.error||'No se pudo completar la operación');return d;
}
function render(items){
 var list=document.getElementById('listaRevisionRedes'),pending=currentState==='pendiente'||currentState==='fallido';
 if(!items.length){list.innerHTML='<div class="admin-history-empty">No hay respuestas en esta sección.</div>';return}
 list.innerHTML=items.map(function(x){
  var platform=x.plataforma==='page'?'Facebook':'Instagram',reply=x.respuesta||'',reasons=Array.isArray(x.razones)?x.razones.join(' · '):'';
  return '<article class="review-card '+(pending?'':'is-readonly')+'" data-id="'+esc(x.id)+'">'+
   '<div class="review-head"><div><span class="review-platform">'+platform+' · '+esc(x.tipo||'interacción')+'</span><div class="review-category">'+esc(x.categoria)+' · '+esc(x.accion_sugerida)+'</div></div><div class="review-state">'+esc(x.estado)+'<br>'+dateAR(x.creado_en)+'</div></div>'+
   '<div class="review-original"><div class="review-author">@'+esc(x.actor_usuario||'usuario')+'</div>'+esc(x.contenido||'(sin texto)')+'</div>'+
   (reasons?'<div class="review-reasons"><strong>Motivo de revisión:</strong> '+esc(reasons)+'</div>':'')+
   '<label class="form-label">Respuesta sugerida '+(pending?'(podés editarla antes de publicar)':'')+'</label><textarea '+(pending?'':'readonly')+' maxlength="2200">'+esc(reply)+'</textarea>'+
   '<div class="review-actions">'+(pending?'<button class="review-publish" onclick="publicarRevisionRedes(this)">Aprobar y publicar</button><button class="review-discard" onclick="descartarRevisionRedes(this)">Descartar</button>':'')+(x.enlace_origen?'<a class="review-origin-link" target="_blank" rel="noopener" href="'+esc(x.enlace_origen)+'">Abrir en la red social</a>':'')+'</div></article>';
 }).join('');
}
window.cargarRevisionRedes=async function(state){
 currentState=state||currentState;var status=document.getElementById('estadoRevisionRedes');status.className='admin-history-status warn';status.textContent='Cargando respuestas…';
 try{var d=await api({accion:'listar_revision',estado:currentState});render(d.items||[]);status.className='admin-history-status ok';status.textContent=(d.items||[]).length+' respuesta(s) en esta sección.';if(currentState==='pendiente'){var c=document.getElementById('contadorRevisionRedes');c.textContent=(d.items||[]).length;c.style.display=(d.items||[]).length?'inline-grid':'none'}}catch(e){status.textContent=e.message;document.getElementById('listaRevisionRedes').innerHTML='<div class="admin-history-empty">No se pudo cargar la bandeja.</div>'}
};
window.abrirRevisionRedes=function(){mostrarSeccionAdmin('secRevisionRedes');document.querySelectorAll('.review-tabs button').forEach(function(b){b.classList.toggle('active',b.dataset.reviewState==='pendiente')});cargarRevisionRedes('pendiente')};
window.cambiarEstadoRevisionRedes=function(state,button){document.querySelectorAll('.review-tabs button').forEach(function(b){b.classList.remove('active')});button.classList.add('active');cargarRevisionRedes(state)};
window.publicarRevisionRedes=async function(button){var card=button.closest('.review-card'),text=card.querySelector('textarea').value.trim();if(!text){alert('La respuesta no puede quedar vacía.');return}if(!confirm('¿Publicar esta respuesta ahora en la conversación original?'))return;button.disabled=true;try{await api({accion:'publicar_revision',borrador_id:card.dataset.id,respuesta:text});card.remove();alert('✓ Respuesta publicada y registrada en la auditoría.')}catch(e){alert(e.message)}finally{button.disabled=false}};
window.descartarRevisionRedes=async function(button){var card=button.closest('.review-card');if(!confirm('¿Descartar esta respuesta sin publicarla?'))return;button.disabled=true;try{await api({accion:'descartar_revision',borrador_id:card.dataset.id});card.remove()}catch(e){alert(e.message)}finally{button.disabled=false}};
})();
</script>
