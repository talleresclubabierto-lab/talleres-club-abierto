name: Android 1.6 - web snapshot 2026-10-30 17:26 ART

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Android native 1.5
        uses: actions/checkout@v4

      - name: Checkout pinned web source
        uses: actions/checkout@v4
        with:
          ref: 5f86f8707255fe7c4f923fa0d8f143c3c7be5abb
          path: web-snapshot

      - name: Synchronize web source into Android
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html scouting.html manifest.webmanifest service-worker.js icon.svg ; do
            test -f "web-snapshot/$f"
            cp "web-snapshot/$f" "$f"
          done
          mkdir -p scouting assets src
          cp web-snapshot/scouting/scouting.css scouting/scouting.css
          cp web-snapshot/scouting/scouting.js scouting/scouting.js
          cp web-snapshot/assets/club-abierto-logo.webp assets/club-abierto-logo.webp
          cp web-snapshot/src/estructura-institucional.css src/estructura-institucional.css
          cp web-snapshot/src/estructura-institucional.js src/estructura-institucional.js
          echo "Web commit pinned: 5f86f8707255fe7c4f923fa0d8f143c3c7be5abb"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build and synchronize Capacitor
        run: npm run cap:sync

      - name: Verify expected web assets
        run: |
          test -s www/index.html
          test -s www/scouting.html
          test -s www/scouting/scouting.js
          test -s www/scouting/scouting.css
          grep -q 'data-v12="estructura-institucional"' www/index.html
          test -s www/assets/club-abierto-logo.webp
          grep -q 'versionCode 7' android/app/build.gradle
          grep -q 'versionName "1.6"' android/app/build.gradle

      - name: Build unsigned release and debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Sign Android App Bundle when signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" ]]; then
            echo "Signing secrets are missing. Release bundle remains UNSIGNED and cannot be uploaded to Play."
            exit 0
          fi
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          signed="android/app/build/outputs/bundle/release/app-release-firmado.aab"
          unsigned="android/app/build/outputs/bundle/release/app-release.aab"
          if [[ -n "$ANDROID_KEY_PASSWORD" ]]; then
            jarsigner -keystore "$keyfile" -storetype PKCS12 \
              -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar "$signed" "$unsigned" clubabierto-upload
          else
            jarsigner -keystore "$keyfile" -storetype PKCS12 \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar "$signed" "$unsigned" clubabierto-upload
          fi
          jarsigner -verify "$signed" | grep -q 'jar verified.'
          # Check that the signer is the Google Play upload key; do not log credentials.
          cert_sha="$(keytool -list -v -keystore "$keyfile" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias clubabierto-upload | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          expected='0A:03:43:03:EE:E0:F1:D0:D9:11:3A:DF:2B:EB:3F:E1:89:06:B0:98:50:C0:06:CF:CB:71:56:47:9F:25:A4:3E'
          [[ "$cert_sha" == "$expected" ]] || { echo 'Upload certificate SHA-256 does not match Google Play.'; rm -f "$signed"; exit 1; }
          echo 'Release bundle signed and verified against Google Play upload certificate.'

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: talleres-android-1.6-web-20261030
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release-firmado.aab
