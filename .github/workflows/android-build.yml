
name: Android build manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Android
        uses: actions/checkout@v4
        with:
          # Verified Android 1.8 baseline: fix/android-1.8-three-access-pages-20261102.
          ref: f406829e778eb27de8021964214b819899d836b0

      - name: Checkout web actual
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: production-web

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar y verificar la web del commit seleccionado
        working-directory: production-web
        run: |
          node scripts/build-mobile.mjs
          node scripts/test-mobile-build.mjs

      - name: Copiar el contenido web completo a Android
        run: |
          rm -rf www
          cp -R production-web/www www

      - name: Asignar nueva version Android sin cambiar appId
        run: |
          grep -q 'versionCode 9' android/app/build.gradle
          grep -q 'versionName "1.8"' android/app/build.gradle
          sed -i 's/versionCode 9/versionCode 10/; s/versionName "1.8"/versionName "1.9"/' android/app/build.gradle
          grep -q 'versionCode 10' android/app/build.gradle
          grep -q 'versionName "1.9"' android/app/build.gradle
          grep -q 'applicationId "com.talleresclubabierto.app"' android/app/build.gradle

      - name: Sincronizar Capacitor
        # Keep the native branch's locked dependencies/config, but do not rerun its old web builder.
        run: |
          npx --no-install cap sync android
          cmp production-web/www/index.html android/app/src/main/assets/public/index.html
          cmp production-web/www/acceso-socios.html android/app/src/main/assets/public/acceso-socios.html
          cmp production-web/www/acceso-administrador.html android/app/src/main/assets/public/acceso-administrador.html
          cmp production-web/www/scouting/scouting.js android/app/src/main/assets/public/scouting/scouting.js
          cmp production-web/www/scouting/scouting.css android/app/src/main/assets/public/scouting/scouting.css
          cmp production-web/www/assets/club-abierto-background.webp android/app/src/main/assets/public/assets/club-abierto-background.webp
          cmp production-web/www/comunidad-formativa.html android/app/src/main/assets/public/comunidad-formativa.html

      - name: Compilar Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Verificar artefactos generados
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/bundle/release/app-release.aab
          echo "Bundle preliminar generado; se exige firma verificada en el paso siguiente."

      - name: Firmar AAB con clave de carga existente y validar certificado
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::Faltan secretos de firma ANDROID_KEYSTORE_BASE64 o ANDROID_KEYSTORE_PASSWORD. No se publicara AAB sin firmar."
            exit 1
          fi
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          expected='0A:03:43:03:EE:E0:F1:D0:D9:11:3A:DF:2B:EB:3F:E1:89:06:B0:98:50:C0:06:CF:CB:71:56:47:9F:25:A4:3E'
          cert_sha="$(keytool -list -v -keystore "$keyfile" -storetype PKCS12 -storepass:env ANDROID_KEYSTORE_PASSWORD -alias clubabierto-upload | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          if [[ "$cert_sha" != "$expected" ]]; then
            echo "::error::Certificado de carga SHA-256 diferente al historico. Se bloquea el lanzamiento."
            exit 1
          fi
          unsigned="android/app/build/outputs/bundle/release/app-release.aab"
          signed="android/app/build/outputs/bundle/release/app-release-firmado.aab"
          test -s "$unsigned"
          if [[ -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            jarsigner -keystore "$keyfile" -storetype PKCS12 \
              -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar "$signed" "$unsigned" clubabierto-upload
          else
            jarsigner -keystore "$keyfile" -storetype PKCS12 \
              -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar "$signed" "$unsigned" clubabierto-upload
          fi
          jarsigner -verify "$signed" | grep -q 'jar verified.'
          test -s "$signed"
          echo "AAB firmado: certificado de carga SHA-256 coincide con el historico."
          sha256sum "$signed"

      - name: Guardar compilacion
        uses: actions/upload-artifact@v4
        with:
          name: talleres-android-1.9-codigo10-firmado
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/app-release-firmado.aab
          if-no-files-found: error
          retention-days: 14
