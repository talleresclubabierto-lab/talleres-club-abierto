name: Performance safety checks
on:
  pull_request:
    paths:
      - 'scripts/build-cloudflare.mjs'
      - 'index.html'
      - 'scouting.html'
      - 'scouting/**'
      - 'supabase/functions/scouting-api/**'
      - 'scripts/test-scouting-*.mjs'
      - 'src/estructura-institucional.js'
      - 'comunidad-formativa*.html'
      - 'comunidad-formativa/**'
      - 'scripts/test-formative-html.mjs'
      - 'scripts/test-navigation-stability.mjs'
      - '.github/workflows/performance-safety.yml'
  workflow_dispatch:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check build script syntax
        run: node --check scripts/build-cloudflare.mjs
      - name: Build web
        run: node scripts/build-cloudflare.mjs
      - name: Prevent institutional navigation observer loops
        run: node scripts/test-navigation-stability.mjs
      - name: Validate formative HTML and routes
        run: node scripts/test-formative-html.mjs
      - name: Validate scouting access in both panels
        run: node scripts/test-scouting-navigation.mjs
      - name: Validate shared scouting dashboard and references
        run: node scripts/test-scouting-frontend.mjs
      - name: Validate scouting API adapter
        run: node --experimental-strip-types --test scripts/test-scouting-api.mjs
      - name: Check non-blocking startup dependencies
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html = readFileSync('dist/index.html', 'utf8');
          for (const tag of html.match(/<script\b[^>]*\bsrc=[^>]+>/gi) || []) {
            if (tag.includes('cdn.jsdelivr.net')) assert(/\basync\b/.test(tag), 'External library blocks startup: ' + tag);
          }
          console.log('Startup remains independent of external library downloads');
          EOF
      - name: Validate login bootstrap request deduplication
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('dist/index.html','utf8');
          const start=html.indexOf('async function inicializarPersistenciaCompartida()');
          assert(start>0,'Bootstrap function missing');
          const body=html.slice(start,html.indexOf('var ID_SOCIO_ACTIVO',start));
          assert.equal((body.match(/await cargarEstadoInicialAutenticado\(\)/g)||[]).length,1,'Expected exactly one initial state fetch');
          for(const name of ['cargarPadronDesdeTablaSocios','cargarAdministradoresDesdeTabla','cargarEncuestasDesdeTablas','cargarVotosDesdeTabla']) {
            assert(!body.includes('await '+name+'()'),'Redundant bootstrap fetch: '+name);
          }
          assert(body.includes('comprobarServicioCredenciales()'),'Credential service check removed');
          assert(body.includes('cargarEstadoGlobalRemoto()'),'Global state load removed');
          console.log('Login bootstrap deduplication checks passed');
          EOF
      - name: Validate immediate authenticated login
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('dist/index.html','utf8');
          const start=html.indexOf('async function procesarIngreso(');
          assert(start>0,'Login handler missing');
          const body=html.slice(start,html.indexOf('function irACambioClave()',start));
          assert(body.includes('await loginSeguroClub(id,clave)'), 'Backend authentication missing');
          assert(!body.includes('setTimeout(resolve,700)'), 'Artificial wait remains');
          assert(body.indexOf('ejecutarAnimacion(face,finger')<body.indexOf('cargaEstado=cargarEstadoInicialAutenticado()'), 'Data hydration still blocks dashboard');
          assert(body.includes('sesion.es_administrador!==true'), 'Admin authorization check missing');
          console.log('Immediate authenticated login checks passed');
          EOF
      - name: Validate generated HTML font loading
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html = readFileSync('dist/index.html','utf8');
          assert(!html.includes("@import url('https://fonts.googleapis.com"), 'Legacy font import remains');
          assert(html.includes('rel="preconnect" href="https://fonts.gstatic.com" crossorigin'), 'Missing preconnect');
          assert(html.includes('rel="stylesheet" href="https://fonts.googleapis.com/css2?'), 'Missing stylesheet');
          assert(html.includes('data-v12="estructura-institucional"'), 'Institutional CSS missing');
          assert(html.includes('data-v12="estructura-institucional"') && html.includes('data-v12="estructura-institucional">'), 'Institutional JS missing');
          console.log('Web build smoke checks passed');
          EOF

