name: Compile blockchain contract

on:
  push:
    paths:
      - "blockchain/contracts/**"
      - "blockchain/scripts/**"
      - "blockchain/package.json"
      - ".github/workflows/blockchain-compile.yml"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockchain/package.json
      - run: npm install
      - run: npm run compile
      - name: Commit compiled artifact
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blockchain/artifacts/ClubAbiertoAnchor.json blockchain/package-lock.json
          if git diff --cached --quiet; then
            echo "No compiled changes"
          else
            git commit -m "Build ClubAbiertoAnchor artifact"
            git push
          fi
